<app-navbar></app-navbar>

<div class="cart-content">
  <h1 class="page-title">Shopping Cart</h1>

  <div class="cart-wrapper" *ngIf="cartItems.length > 0">
    <div class="cart-items">
      <div class="cart-item card" *ngFor="let item of cartItems">
        <img [src]="item.image" [alt]="item.name" class="item-image">
        <div class="item-details">
          <h3>{{ item.name }}</h3>
          <p class="item-category">{{ item.category }}</p>
          <p class="item-price">${{ item.price }}</p>
        </div>
        <div class="item-quantity">
          <button class="qty-btn" (click)="updateQuantity(item.id, item.quantity - 1)">-</button>
          <input type="number" [(ngModel)]="item.quantity" (change)="updateQuantity(item.id, item.quantity)" min="1">
          <button class="qty-btn" (click)="updateQuantity(item.id, item.quantity + 1)">+</button>
        </div>
        <div class="item-total">
          <p>${{ (item.price * item.quantity).toFixed(2) }}</p>
        </div>
        <button class="remove-btn" (click)="removeFromCart(item.id, item.name)" title="Remove">✕</button>
      </div>
    </div>

    <div class="cart-summary card">
      <h2>Order Summary</h2>
      <div class="summary-row">
        <span>Subtotal</span>
        <span>${{ cartTotal.toFixed(2) }}</span>
      </div>
      <div class="summary-row">
        <span>Shipping</span>
        <span>Free</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span>${{ cartTotal.toFixed(2) }}</span>
      </div>
      <button class="btn btn-primary btn-checkout" (click)="proceedToCheckout()">Proceed to Checkout</button>
      <button class="btn-continue" (click)="continueShopping()">Continue Shopping</button>
    </div>
  </div>

  <div class="empty-cart" *ngIf="cartItems.length === 0">
    <span class="empty-icon">🛒</span>
    <p>Your cart is empty.</p>
    <button class="btn btn-primary" (click)="continueShopping()">Continue Shopping</button>
  </div>
</div>

<app-footer></app-footer>
