<div class="register-container">
  <a routerLink="/home" class="back-home">&larr; Back to ShopHub</a>

  <div class="register-card fade-in-up">
    <div class="register-header">
      <h1 class="logo">ShopHub</h1>
      <p class="subtitle">Create your account to start shopping.</p>
    </div>

    <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form class="register-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" [(ngModel)]="registerForm.name" name="name" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="registerForm.email" name="email" required placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" [(ngModel)]="registerForm.phone" name="phone" placeholder="Enter your phone number">
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" [(ngModel)]="registerForm.address" name="address" placeholder="Enter your address">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="registerForm.password" name="password" required placeholder="At least 6 characters">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" [(ngModel)]="registerForm.confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
      </div>

      <button type="submit" class="btn-register" [disabled]="submitting">
        <span *ngIf="!submitting">Register</span>
        <span *ngIf="submitting">Creating account&hellip;</span>
      </button>
    </form>

    <div class="register-footer">
      <p>Already have an account? <a routerLink="/login">Login here</a></p>
    </div>
  </div>
</div>
